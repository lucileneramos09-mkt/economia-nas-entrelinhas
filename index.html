<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Economia nas Entrelinhas — 2026</title><style>*{box-sizing:border-box}body{margin:0;background:#0a1724;color:#f0f5fa;font:16px/1.55 system-ui,Arial}main{max-width:900px;margin:auto;padding:20px}.panel{background:#13293b;border:1px solid #36546a;border-radius:18px;padding:24px;margin:16px 0}h1,h2{line-height:1.2}h1{font-size:2rem}.muted{color:#bbcad5}.pill{display:inline-block;background:#294b61;border-radius:30px;padding:4px 12px;font-size:.85rem;margin:4px 4px 4px 0}button,.btn{background:#69d7bd;color:#08251e;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.outline{background:transparent;color:#f0f5fa;border:1px solid #678498}input,textarea{width:100%;padding:12px;border:1px solid #638299;border-radius:9px;background:#081724;color:white;font:inherit}textarea{min-height:150px}.option{display:block;width:100%;text-align:left;margin:9px 0;background:#213a4d;color:white;border:1px solid #58768a;font-weight:500}.option.selected{border:2px solid #69d7bd;background:#285a5c}.option:disabled{opacity:1}.feedback{border-left:4px solid #69d7bd;padding:12px;background:#173e45;margin:12px 0}.warning{border-left-color:#f7bb70}.progress{height:8px;border-radius:9px;background:#345064;overflow:hidden}.progress div{height:100%;background:#69d7bd}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.space{justify-content:space-between}a{color:#9ce5ff}.source{background:#0b1f30;border-radius:12px;padding:18px;border:1px solid #486379}.score{font-size:2rem;font-weight:800}small{color:#b9cbd7}label{display:block;margin:10px 0 5px}</style></head><body><main id="root"></main><script>const dossiers=[{"title": "Inflação: o que a manchete não conta", "headline": "Inflação desacelera e fica em 0,14% em outubro", "url": "https://agenciagov.ebc.com.br/noticias/202611/inflacao-desacelera-e-fica-em-0-14-em-outubro", "excerpt": "A inflação medida pelo IPCA desacelerou em outubro de 2026. Ao mesmo tempo, diferentes grupos de produtos podem ter variações distintas. Uma taxa positiva significa aumento médio dos preços, ainda que mais lento do que antes.", "questions": [{"q": "Uma pessoa afirma: “A inflação caiu, então tudo ficou mais barato.” Qual é a falha?", "opts": ["Confunde desaceleração da inflação com queda generalizada dos preços.", "A manchete não demonstra que todos os preços caíram.", "Os preços de todos os produtos seguem o IPCA exatamente.", "Uma taxa menor torna irrelevante o orçamento familiar."], "correct": 0}, {"q": "Qual interpretação é economicamente mais consistente?", "opts": ["Os preços sobem, em média, mais devagar, mas o impacto varia conforme a cesta de consumo.", "Todas as famílias sentirão o mesmo alívio no orçamento.", "Os alimentos necessariamente ficaram mais baratos.", "A notícia prova aumento do salário real."], "correct": 0}, {"q": "Qual informação ou atitude ajudaria a investigar melhor?", "opts": ["Comparar preços de itens consumidos pela família e evolução de sua renda.", "Observar apenas o índice geral.", "Considerar que um produto representa todos os outros.", "Ignorar a composição dos gastos."], "correct": 0}, {"q": "Qual conclusão evita generalizações indevidas?", "opts": ["O índice geral resume uma média e não descreve igualmente cada produto ou família.", "O IPCA determina o preço que cada loja pode cobrar.", "O índice informa a causa exata de cada aumento.", "A média permite concluir que nenhum produto subiu acima dela."], "correct": 0}], "essay": "Uma família diz que não percebeu melhora apesar da desaceleração da inflação. Explique duas razões plausíveis e diga qual informação adicional você buscaria."}, {"title": "Juros: efeitos além do financiamento", "headline": "Copom mantém taxa Selic em 13,75% ao ano", "url": "https://www.bcb.gov.br/publicacoes/atascopom/04112026", "excerpt": "A taxa básica de juros é uma referência importante para as condições de crédito e para decisões de consumo e investimento. O efeito sobre cada pessoa ou empresa depende das condições concretas de financiamento, renda e expectativas.", "questions": [{"q": "Um comerciante afirma: “A Selic não me afeta porque não tenho empréstimos.” Qual análise é mais cuidadosa?", "opts": ["A Selic pode influenciar clientes, fornecedores e alternativas de investimento, mesmo sem dívida própria.", "A Selic afeta exclusivamente quem já tem empréstimo.", "Toda mudança na Selic altera imediatamente todos os preços.", "Os juros eliminam a necessidade de analisar demanda."], "correct": 0}, {"q": "Qual interpretação é economicamente mais consistente?", "opts": ["O custo do crédito pode influenciar decisões de compra e de expansão.", "A taxa básica determina automaticamente a taxa de todo cartão.", "A notícia prova que todas as empresas vão reduzir as vendas.", "Nenhum consumidor muda comportamento diante de juros."], "correct": 0}, {"q": "Qual informação ou atitude ajudaria a investigar melhor?", "opts": ["Condições de crédito dos clientes e evolução das vendas.", "A cor do anúncio da loja.", "Somente o número de seguidores da empresa.", "A opinião de um único comprador."], "correct": 0}, {"q": "Qual conclusão evita generalizações indevidas?", "opts": ["Os efeitos variam por setor, perfil de consumidor e forma de financiamento.", "Todas as empresas respondem da mesma forma.", "A manchete fornece uma previsão certa de vendas.", "A Selic é igual à inflação."], "correct": 0}], "essay": "Você administra uma loja de bens duráveis. Como explicaria dois possíveis efeitos dos juros sobre os clientes sem afirmar que eles ocorrerão obrigatoriamente?"}, {"title": "Emprego: além do número de vagas", "headline": "Brasil registra saldo positivo de empregos formais em setembro", "url": "https://www.gov.br/secom/pt-br/acompanhe-a-secom/noticias/2026/11/brasil-gera-121-3-mil-empregos-formais-em-setembro-e-saldo-no-ano-chega-a-1-24-milhao-de-novos-postos-com-carteira-assinada/", "excerpt": "O saldo de empregos formais corresponde à diferença entre admissões e desligamentos em um período. Um saldo positivo é informação relevante, mas isoladamente não descreve remuneração, condições de trabalho nem todos os tipos de ocupação.", "questions": [{"q": "Um aluno conclui: “O saldo foi positivo; logo, todos os trabalhadores melhoraram de vida.” Como avaliar?", "opts": ["É uma generalização: saldo de vagas não mede sozinho salários e condições de trabalho.", "Está correto, pois toda contratação representa aumento de salário para todos.", "O saldo positivo prova que ninguém perdeu emprego.", "O indicador não tem qualquer utilidade."], "correct": 0}, {"q": "Qual interpretação é economicamente mais consistente?", "opts": ["Analisar remuneração, distribuição setorial e outros indicadores de trabalho.", "Usar apenas o título da notícia.", "Tratar admissões como se fossem saldo.", "Concluir que o emprego informal desapareceu."], "correct": 0}, {"q": "Qual informação ou atitude ajudaria a investigar melhor?", "opts": ["Uma região pode gerar vagas em alguns setores e perder em outros.", "Todas as regiões sempre seguem a média nacional.", "O saldo nacional identifica o salário de cada trabalhador.", "Toda contratação ocorre na indústria."], "correct": 0}, {"q": "Qual conclusão evita generalizações indevidas?", "opts": ["Distinguir o que o dado mostra daquilo que exigiria informações adicionais.", "Substituir a notícia por opinião pessoal.", "Considerar um único indicador como prova de tudo.", "Descartar qualquer dado estatístico."], "correct": 0}], "essay": "Uma empresa pretende abrir uma unidade após ler a notícia. Quais duas informações adicionais deveria pesquisar antes de decidir? Justifique."}, {"title": "Comércio: vendas e comportamento do consumidor", "headline": "Vendas no comércio variam 0,2% em setembro, mostra IBGE", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/vendas-no-comercio-variam-02-em-setembro-ibge-mostra-estabilidade", "excerpt": "A variação das vendas do comércio é uma pista sobre o consumo, mas o comportamento de cada segmento pode ser diferente. Uma notícia agregada não permite concluir automaticamente como está a situação de uma loja específica.", "questions": [{"q": "Uma gerente lê a notícia e decide reduzir todos os preços. Qual é a melhor crítica?", "opts": ["Antes, deve investigar seu público, seus custos e o desempenho dos próprios produtos.", "Uma variação agregada determina a estratégia de todas as lojas.", "Reduzir preço sempre aumenta lucro.", "O comportamento dos consumidores é idêntico em todos os setores."], "correct": 0}, {"q": "Qual interpretação é economicamente mais consistente?", "opts": ["Uma média pode esconder desempenhos diferentes entre setores e regiões.", "Todos os segmentos necessariamente variaram 0,2%.", "O índice informa as preferências de cada cliente.", "Não é possível aprender nada com indicadores agregados."], "correct": 0}, {"q": "Qual informação ou atitude ajudaria a investigar melhor?", "opts": ["Entrevistar clientes e comparar a evolução das vendas da própria loja.", "Tomar a manchete como previsão certa.", "Copiar a decisão do concorrente sem análise.", "Ignorar reclamações e mudanças de preferência."], "correct": 0}, {"q": "Qual conclusão evita generalizações indevidas?", "opts": ["Uma decisão empresarial deve combinar informações gerais e evidências locais.", "A notícia dispensa qualquer pesquisa adicional.", "Um único mês prova tendência permanente.", "O preço é o único fator que influencia compras."], "correct": 0}], "essay": "Uma papelaria tem vendas fracas enquanto o comércio geral parece estável. Proponha duas hipóteses e como investigá-las, sem cálculos."}, {"title": "Oferta e demanda: quando falta produto", "headline": "Notícias de preços e abastecimento: leitura econômica", "url": "https://agenciadenoticias.ibge.gov.br/", "excerpt": "CENÁRIO DIDÁTICO, NÃO UMA REPORTAGEM ESPECÍFICA: chuvas intensas dificultam o transporte de hortaliças para uma cidade. Comerciantes relatam menos produtos disponíveis e consumidores percebem mudanças nos preços. A situação permite analisar oferta, demanda e substituição de produtos sem pressupor um resultado único em todos os mercados.", "questions": [{"q": "Qual interpretação é mais bem sustentada pelo cenário?", "opts": ["Dificuldades de abastecimento podem reduzir a oferta e pressionar preços, dependendo de outras condições.", "Qualquer chuva obriga todas as lojas a aumentar preços.", "A demanda necessariamente desaparece.", "O cenário comprova uma inflação geral permanente."], "correct": 0}, {"q": "Qual interpretação é economicamente mais consistente?", "opts": ["Consumidores podem substituir alguns itens, dependendo das preferências e alternativas disponíveis.", "Todos substituem produtos da mesma maneira.", "Não existe relação entre oferta e preço.", "A oferta de todos os produtos é idêntica."], "correct": 0}, {"q": "Qual informação ou atitude ajudaria a investigar melhor?", "opts": ["Consultar fornecedores, estoques e alternativas de abastecimento antes de decidir.", "Concluir que a escassez durará para sempre.", "Aumentar preços sem observar o mercado.", "Ignorar as necessidades dos clientes."], "correct": 0}, {"q": "Qual conclusão evita generalizações indevidas?", "opts": ["Um evento localizado não basta para concluir que toda a economia enfrenta a mesma situação.", "O preço de um item define todos os índices.", "A falta temporária prova mudança permanente da demanda.", "Uma única loja representa todo o país."], "correct": 0}], "essay": "Você administra um restaurante e um ingrediente ficou difícil de encontrar. Compare duas respostas possíveis e explique os impactos para clientes e fornecedores."}];let st={name:'',team:'',block:0,phase:'intro',q:0,answers:[],essays:[],selection:null,locked:false,read:false};const root=document.getElementById('root');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const score=()=>st.answers.filter(x=>x.correct).length*4;function opts(q){let shift=(st.block*2+st.q+1)%4;return q.opts.map((v,i)=>({v,i})).slice(shift).concat(q.opts.map((v,i)=>({v,i})).slice(0,shift))}function render(){let d=dossiers[st.block],h='';if(st.phase==='intro'){h=`<section class="panel"><h1>📰 Economia nas Entrelinhas</h1><p class="muted">Investigue manchetes, diferencie fatos de inferências e argumente com responsabilidade. Sem cálculos.</p><span class="pill">5 dossiês</span><span class="pill">20 desafios</span><span class="pill">5 análises críticas</span><span class="pill">100 minutos</span><label>Nome completo</label><input id="name" value="${esc(st.name)}" placeholder="Seu nome"><label>Equipe ou turma</label><input id="team" value="${esc(st.team)}" placeholder="Equipe / turma"><p><button id="start">Iniciar investigação</button></p></section>`}else if(st.phase==='end'){h=`<section class="panel"><h1>Investigação concluída!</h1><p>${esc(st.name)} · ${esc(st.team)}</p><p class="score">${score()} / 80 pontos objetivos</p><p>As cinco análises escritas valem até 20 pontos, avaliados pela professora. Nota final = (pontos objetivos + pontos escritos) ÷ 10.</p><button id="download">Baixar relatório completo (.txt)</button><p><small>Salve o relatório antes de fechar esta página. Não há envio automático nem armazenamento em servidor.</small></p></section>`}else{let idx=st.block;h=`<div class="row space"><span class="pill">Dossiê ${idx+1} de 5</span><span class="pill">${score()} pontos objetivos</span></div><div class="progress"><div style="width:${(idx/5+(st.phase==='quiz'?(st.q+1)/25:st.phase==='essay'?1/5:0))*100}%"></div></div>`;if(st.phase==='read'){h+=`<section class="panel"><h2>${esc(d.title)}</h2><div class="source"><small>MANCHETE / CONTEXTO</small><h3>${esc(d.headline)}</h3><p>${esc(d.excerpt)}</p><small>${idx===4?'Cenário fictício de aplicação conceitual.':'Síntese didática da notícia, não citação literal.'}</small></div><p><a href="${d.url}" target="_blank" rel="noopener noreferrer">Consultar fonte ${idx===4?'de pesquisa':'original'} ↗</a></p><p class="muted">Leia atentamente. Pergunte: o que o texto comprova? O que ele não permite afirmar? Quem pode ser afetado?</p><label class="row"><input style="width:auto" type="checkbox" id="readcheck" ${st.read?'checked':''}> Li o trecho e identifiquei o fato central.</label><button id="toquiz" ${st.read?'':'disabled'}>Desbloquear perguntas</button></section>`}else if(st.phase==='quiz'){let q=d.questions[st.q];h+=`<section class="panel"><span class="pill">Questão ${st.q+1} de 4</span><h2>${esc(q.q)}</h2><p class="muted">Escolha a interpretação mais bem fundamentada. Algumas alternativas parecem plausíveis, mas extrapolam a notícia.</p>${opts(q).map(o=>`<button class="option ${st.selection===o.i?'selected':''}" data-option="${o.i}" ${st.locked?'disabled':''}>${esc(o.v)}</button>`).join('')}${st.locked?`<div class="feedback ${st.selection===q.correct?'':'warning'}"><b>${st.selection===q.correct?'Interpretação consistente.':'Reexamine a generalização.'}</b><p>${esc(q.opts[q.correct])}</p><small>Compare o alcance da afirmação com as evidências disponíveis.</small></div><button id="nextq">${st.q===3?'Ir para análise crítica':'Próxima pergunta'}</button>`:`<button id="check" ${st.selection===null?'disabled':''}>Confirmar resposta</button>`}</section>`}else if(st.phase==='essay'){h+=`<section class="panel"><span class="pill">Análise crítica · até 4 pontos</span><h2>Decisão e argumentação</h2><p>${esc(d.essay)}</p><p class="muted">Escreva pelo menos 3 frases: hipótese ou explicação, justificativa econômica e dado que ajudaria a confirmar sua análise.</p><textarea id="essay" placeholder="Escreva sua análise aqui...">${esc(st.essays[idx]||'')}</textarea><p><button id="finishblock">${idx===4?'Finalizar jogo':'Próximo dossiê'}</button></p></section>`}}root.innerHTML=h;bind()}function bind(){let id=x=>document.getElementById(x);if(id('start'))id('start').onclick=()=>{st.name=id('name').value.trim();st.team=id('team').value.trim();if(!st.name)return alert('Informe seu nome.');st.phase='read';render()};if(id('readcheck'))id('readcheck').onchange=e=>{st.read=e.target.checked;id('toquiz').disabled=!st.read};if(id('toquiz'))id('toquiz').onclick=()=>{st.phase='quiz';st.q=0;render()};document.querySelectorAll('[data-option]').forEach(el=>el.onclick=()=>{st.selection=Number(el.dataset.option);render()});if(id('check'))id('check').onclick=()=>{let q=dossiers[st.block].questions[st.q];st.answers.push({block:st.block,question:st.q,selected:st.selection,correct:st.selection===q.correct});st.locked=true;render()};if(id('nextq'))id('nextq').onclick=()=>{st.locked=false;st.selection=null;if(st.q<3)st.q++;else st.phase='essay';render()};if(id('finishblock'))id('finishblock').onclick=()=>{let t=id('essay').value.trim();if(t.length<90)return alert('Desenvolva sua análise em pelo menos 90 caracteres.');st.essays[st.block]=t;if(st.block===4)st.phase='end';else{st.block++;st.phase='read';st.read=false}render()};if(id('download'))id('download').onclick=download}function download(){let lines=['ECONOMIA NAS ENTRELINHAS — RELATÓRIO','Aluno: '+st.name,'Equipe: '+st.team,'Pontos objetivos: '+score()+'/80','Análises escritas: até 20 pontos (correção docente)',''];dossiers.forEach((d,i)=>{lines.push('DOSSIÊ '+(i+1)+' — '+d.title,'Fonte: '+d.url);d.questions.forEach((q,j)=>{let a=st.answers.find(x=>x.block===i&&x.question===j);lines.push('Questão '+(j+1)+': '+q.q,'Resposta: '+(a?q.opts[a.selected]:'Não respondida'),'Resultado: '+(a?.correct?'Adequada':'Rever interpretação'))});lines.push('ANÁLISE: '+(st.essays[i]||''),'')});let blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='relatorio-economia-'+st.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();</script></body></html>
